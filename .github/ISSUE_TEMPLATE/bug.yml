name: Bug report
description: Report a reproducible problem that does not expose credentials
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For credential exposure or repeating Keychain prompts, use the private Security reporting flow. Never paste tokens or Keychain exports here.
  - type: input
    id: version
    attributes:
      label: vibecom bar version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 15.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that causes the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
