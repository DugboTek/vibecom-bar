name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run offline test suite
        run: swift test
      - name: Build the app bundle
        run: VIBECOM_SIGN_IDENTITY="-" ./scripts/build-app.sh
      - name: Check installer syntax under macOS bash 3.2
        run: /bin/bash -n scripts/install.sh
