name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run offline test suite
        run: swift test
      - name: Build release binary
        run: swift build -c release --product VibecomBar
